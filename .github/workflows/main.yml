
name: Build ShiftRepairForge

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Forge mod
        run: gradle build --no-daemon

      - name: Check JAR
        run: |
          echo "Searching for mod JAR..."
          find build/libs -maxdepth 1 -type f -name "*.jar" -print
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ShiftRepairForge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
